spring:
  datasource:
    url: jdbc:h2:mem:dev-db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update   # create / create-drop / update / validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  sql:
    init:
      mode: never

logging:
  level:
    root: INFO

file:
  upload-dir: ${user.dir}/volume

ai-engine:
  base-url: http://localhost:8000